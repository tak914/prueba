<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstraDrop // P2P File Sync</title>
    <!-- Librería PeerJS para la conexión directa -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Lucide Icons para iconos vectoriales limpios -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-main: #0b0d19;
            --glass-bg: rgba(15, 18, 36, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.03);
            
            --cyan-glow: rgba(6, 182, 212, 0.15);
            --purple-glow: rgba(168, 85, 247, 0.15);
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-cyan: #22d3ee;
            --text-purple: #c084fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 40%),
                        var(--bg-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 0;
        }

        .main-title {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 32px;
            background: linear-gradient(135deg, #22d3ee 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(34, 211, 238, 0.2);
            z-index: 1;
            text-align: center;
        }

        .dashboard {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            z-index: 1;
            overflow: hidden;
        }

        .panels-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .panel-left {
            padding: 40px;
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, transparent, rgba(6, 182, 212, 0.02));
        }

        .panel-right {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: linear-gradient(180deg, transparent, rgba(168, 85, 247, 0.02));
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .code-orb {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.05), transparent), var(--glass-highlight);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 40px var(--cyan-glow);
            position: relative;
        }

        .code-orb::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 1px dashed rgba(6, 182, 212, 0.3);
            animation: rotateOrb 20s linear infinite;
        }

        @keyframes rotateOrb { 100% { transform: rotate(360deg); } }

        .code-label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
        .code-number { font-size: 3.2rem; font-weight: 900; color: var(--text-cyan); letter-spacing: 2px; text-shadow: 0 0 15px rgba(34, 211, 238, 0.6); margin: 5px 0; }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 4px;
            text-align: center;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: #a855f7;
            box-shadow: 0 0 25px var(--purple-glow);
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.25);
            transition: all 0.3s;
        }

        button:hover { opacity: 0.95; transform: translateY(-1px); }

        .dropzone {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            padding: 35px 20px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.01);
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .dropzone:hover {
            border-color: var(--text-cyan);
            background: rgba(6, 182, 212, 0.02);
        }

        #fileInput { display: none; }

        /* --- SECCIÓN HISTORIAL Y TABS --- */
        .history-section {
            border-top: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.15);
            padding: 24px;
        }

        .tabs-header {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: none;
            width: auto;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .tab-btn:hover { background: rgba(255, 255, 255, 0.03); color: var(--text-primary); }

        .tab-btn.active {
            color: var(--text-cyan);
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.2);
        }

        .file-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* Scrollbar estética */
        .file-list::-webkit-scrollbar { width: 6px; }
        .file-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        .file-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .file-icon-box {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .file-meta {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .file-name {
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: text-overflow;
            text-overflow: ellipsis;
        }

        .file-size {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .action-btn {
            width: auto;
            padding: 8px 14px;
            font-size: 0.8rem;
            border-radius: 8px;
        }

        .btn-download { background: linear-gradient(135deg, #06b6d4, #3b82f6); box-shadow: none; }
        .status-badge { font-size: 0.8rem; font-weight: 600; padding: 4px 10px; border-radius: 6px; }
        .status-sending { background: rgba(234, 179, 8, 0.1); color: #facc15; }
        .status-success { background: rgba(74, 222, 128, 0.1); color: #4ade80; }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            padding: 30px 0;
        }

        .status-text { font-size: 0.85rem; color: var(--text-secondary); margin-top: 12px; display: flex; align-items: center; gap: 6px; }
        .pulse-icon { width: 8px; height: 8px; background-color: #22d3ee; border-radius: 50%; box-shadow: 0 0 10px #22d3ee; animation: pulse 2s infinite; }
        
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 211, 238, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 211, 238, 0); }
        }

        .hidden { display: none !important; }

        @media (max-width: 768px) {
            .panels-container { grid-template-columns: 1fr; }
            .panel-left { border-right: none; border-bottom: 1px solid var(--glass-border); padding: 30px 20px; }
            .panel-right { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <h1 class="main-title">AstraDrop</h1>

    <div class="dashboard">
        
        <!-- CONTENEDOR DE PANELES PRINCIPALES -->
        <div class="panels-container">
            <!-- PANEL IZQUIERDO: ESTADO / CÓDIGO -->
            <div class="panel-left">
                <div class="section-title"><i data-lucide="radio"></i> Nodo Local</div>
                <div class="code-orb" id="orb-element">
                    <span class="code-label">Tu Código</span>
                    <div class="code-number" id="my-id">••••</div>
                </div>
                <div class="status-text" id="pulse-status">
                    <span class="pulse-icon"></span>
                    <span id="status-string">Iniciando protocolo...</span>
                </div>
            </div>

            <!-- PANEL DERECHO: ACCIONES -->
            <div class="panel-right">
                <!-- Zona Configuración Inicial -->
                <div id="setup-zone">
                    <div class="section-title"><i data-lucide="unplug"></i> Vincular Canal</div>
                    <div style="margin-bottom: 16px;">
                        <input type="text" id="peer-id-input" placeholder="0000" maxlength="4" autocomplete="off">
                    </div>
                    <button id="connect-btn"><i data-lucide="link"></i> Establecer Conexión</button>
                </div>

                <!-- Zona Activa de Transferencia -->
                <div id="transfer-zone" class="hidden">
                    <div class="section-title" style="color: #4ade80;"><i data-lucide="shield-check"></i> Enlace Cifrado Activo</div>
                    <div class="dropzone" onclick="document.getElementById('fileInput').click()">
                        <i data-lucide="upload-cloud" style="width: 40px; height: 40px; color: var(--text-cyan);"></i>
                        <p>Haz clic o arrastra cualquier archivo aquí</p>
                        <input type="file" id="fileInput">
                    </div>
                </div>
            </div>
        </div>

        <!-- SECCIÓN INFERIOR: HISTORIAL DE ENVIADOS / RECIBIDOS -->
        <div id="history-panel" class="history-section hidden">
            <div class="tabs-header">
                <button class="tab-btn active" onclick="switchTab('received')">
                    <i data-lucide="arrow-down-left" style="width:14px; height:14px; display:inline; vertical-align:middle; margin-right:4px;"></i>Recibidos (<span id="count-received">0</span>)
                </button>
                <button class="tab-btn" onclick="switchTab('sent')">
                    <i data-lucide="arrow-up-right" style="width:14px; height:14px; display:inline; vertical-align:middle; margin-right:4px;"></i>Enviados (<span id="count-sent">0</span>)
                </button>
            </div>

            <!-- Lista Recibidos -->
            <div id="list-received" class="file-list">
                <div class="empty-state">No se han recibido archivos en esta sesión.</div>
            </div>

            <!-- Lista Enviados (Oculta por defecto) -->
            <div id="list-sent" class="file-list hidden">
                <div class="empty-state">No has enviado archivos todavía.</div>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();

        const shortId = Math.floor(1000 + Math.random() * 9000).toString();
        const peer = new Peer(shortId, { debug: 1 });
        let conn = null;

        let sentCount = 0;
        let receivedCount = 0;

        peer.on('open', (id) => {
            document.getElementById('my-id').innerText = id;
            document.getElementById('status-string').innerText = "Listo para emparejar";
        });

        peer.on('connection', (connection) => {
            conn = connection;
            bindConnection();
        });

        document.getElementById('connect-btn').addEventListener('click', () => {
            const remoteId = document.getElementById('peer-id-input').value.trim();
            if (remoteId) {
                conn = peer.connect(remoteId);
                bindConnection();
            }
        });

        function bindConnection() {
            // Cambios estéticos de conexión exitosa
            document.getElementById('orb-element').style.boxShadow = "0 0 40px rgba(34, 211, 238, 0.3)";
            document.getElementById('pulse-status').style.color = "#4ade80";
            document.getElementById('pulse-status').querySelector('.pulse-icon').style.backgroundColor = "#4ade80";
            document.getElementById('status-string').innerText = "Conexión P2P Establecida";

            document.getElementById('setup-zone').classList.add('hidden');
            document.getElementById('transfer-zone').classList.remove('hidden');
            document.getElementById('history-panel').classList.remove('hidden');

            conn.on('data', (data) => {
                if (data.file) {
                    receivedCount++;
                    document.getElementById('count-received').innerText = receivedCount;
                    
                    // Eliminar empty state si existe
                    const container = document.getElementById('list-received');
                    if(receivedCount === 1) container.innerHTML = '';

                    const blob = new Blob([data.file], { type: data.type });
                    const blobUrl = URL.createObjectURL(blob);
                    
                    // Detectar icono apropiado
                    let iconName = 'file-text';
                    if(data.type.startsWith('image/')) iconName = 'image';
                    else if(data.type.startsWith('video/')) iconName = 'video';
                    else if(data.type.includes('zip') || data.type.includes('rar')) iconName = 'folder-archive';

                    const item = document.createElement('div');
                    item.className = 'file-item';
                    item.innerHTML = `
                        <div class="file-info">
                            <div class="file-icon-box"><i data-lucide="${iconName}" style="color:var(--text-cyan)"></i></div>
                            <div class="file-meta">
                                <span class="file-name" title="${data.filename}">${data.filename}</span>
                                <span class="file-size">${formatBytes(data.size)}</span>
                            </div>
                        </div>
                        <a href="${blobUrl}" download="${data.filename}" style="text-decoration:none;">
                            <button class="action-btn btn-download"><i data-lucide="download" style="width:14px; height:14px;"></i> Descargar</button>
                        </a>
                    `;
                    container.insertBefore(item, container.firstChild);
                    lucide.createIcons();
                }
            });

            conn.on('close', () => {
                alert("La conexión se ha cerrado de forma remota.");
                location.reload();
            });
        }

        // Envío de archivos (cualquier tipo)
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            sentCount++;
            document.getElementById('count-sent').innerText = sentCount;

            const container = document.getElementById('list-sent');
            if(sentCount === 1) container.innerHTML = '';

            // Crear fila en historial de enviados en estado "enviando"
            const itemUniqueId = 'sending-' + Date.now();
            let iconName = 'file-text';
            if(file.type.startsWith('image/')) iconName = 'image';
            else if(file.type.startsWith('video/')) iconName = 'video';
            else if(file.type.includes('zip') || file.type.includes('rar')) iconName = 'folder-archive';

            const item = document.createElement('div');
            item.className = 'file-item';
            item.id = itemUniqueId;
            item.innerHTML = `
                <div class="file-info">
                    <div class="file-icon-box"><i data-lucide="${iconName}" style="color:var(--text-purple)"></i></div>
                    <div class="file-meta">
                        <span class="file-name" title="${file.name}">${file.name}</span>
                        <span class="file-size">${formatBytes(file.size)}</span>
                    </div>
                </div>
                <span class="status-badge status-sending" id="badge-${itemUniqueId}">Enviando...</span>
            `;
            container.insertBefore(item, container.firstChild);
            lucide.createIcons();

            const reader = new FileReader();
            reader.onload = function(event) {
                if (conn && conn.open) {
                    conn.send({
                        file: event.target.result,
                        filename: file.name,
                        type: file.type,
                        size: file.size
                    });
                    
                    // Cambiar estado a Éxito
                    const badge = document.getElementById(`badge-${itemUniqueId}`);
                    if(badge) {
                        badge.className = 'status-badge status-success';
                        badge.innerText = 'Enviado';
                    }
                } else {
                    alert("Error: El canal P2P no está activo.");
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // Alternar entre pestañas de enviados y recibidos
        function switchTab(type) {
            const tabs = document.querySelectorAll('.tab-btn');
            tabs[0].classList.toggle('active', type === 'received');
            tabs[1].classList.toggle('active', type === 'sent');

            document.getElementById('list-received').classList.toggle('hidden', type !== 'received');
            document.getElementById('list-sent').classList.toggle('hidden', type !== 'sent');
        }

        // Formateador utilitario de peso de archivos
        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
