<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstraDrop // P2P Image Sync</title>
    <!-- Librería PeerJS para la conexión directa -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Lucide Icons para iconos vectoriales limpios -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-main: #0b0d19;
            --glass-bg: rgba(15, 18, 36, 0.4);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.03);
            
            --cyan-glow: rgba(6, 182, 212, 0.15);
            --purple-glow: rgba(168, 85, 247, 0.15);
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-cyan: #22d3ee;
            --text-purple: #c084fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 40%),
                        var(--bg-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        /* Fondo decorativo de red futurista sutil */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 24px 24px;
            pointer-events: none;
            z-index: 0;
        }

        .main-title {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 32px;
            background: linear-gradient(135deg, #22d3ee 0%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px rgba(34, 211, 238, 0.2);
            z-index: 1;
            text-align: center;
        }

        .dashboard {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            width: 100%;
            max-width: 900px;
            min-height: 480px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            z-index: 1;
            overflow: hidden;
        }

        /* Panel Izquierdo: Estado local y códigos */
        .panel-left {
            padding: 40px;
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, transparent, rgba(6, 182, 212, 0.02));
        }

        /* Panel Derecho: Inputs y controles */
        .panel-right {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: linear-gradient(180deg, transparent, rgba(168, 85, 247, 0.02));
        }

        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Esfera de código estilo Sci-Fi */
        .code-orb {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.05), transparent), var(--glass-highlight);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 40px var(--cyan-glow), inset 0 0 20px rgba(6, 182, 212, 0.1);
            position: relative;
            transition: all 0.5s ease;
        }

        .code-orb::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 1px dashed rgba(6, 182, 212, 0.3);
            animation: rotateOrb 20s linear infinite;
        }

        @keyframes rotateOrb { 100% { transform: rotate(360deg); } }

        .code-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .code-number {
            font-size: 3.5rem;
            font-weight: 900;
            color: var(--text-cyan);
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(34, 211, 238, 0.6);
            margin: 5px 0;
        }

        /* Inputs Premium */
        .input-wrapper {
            position: relative;
            margin-bottom: 16px;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 4px;
            text-align: center;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input[type="text"]:focus {
            border-color: #a855f7;
            box-shadow: 0 0 25px var(--purple-glow);
            background: rgba(0, 0, 0, 0.4);
        }

        /* Botón con gradiente animado */
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.25);
            transition: all 0.3s;
        }

        button:hover {
            opacity: 0.95;
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.4);
            transform: translateY(-1px);
        }

        button:active { transform: translateY(1px); }

        /* Zona de carga Dropzone */
        .dropzone {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            padding: 40px 20px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.01);
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .dropzone:hover {
            border-color: var(--text-cyan);
            background: rgba(6, 182, 212, 0.02);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.05);
        }

        .dropzone p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        #fileInput { display: none; }

        /* Preview Dinámico */
        .preview-box {
            margin-top: 20px;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            position: relative;
            background: rgba(0,0,0,0.3);
        }

        .preview-box img {
            width: 100%;
            height: auto;
            display: block;
            max-height: 250px;
            object-fit: contain;
            padding: 10px;
        }

        .status-text {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .pulse-icon {
            width: 8px;
            height: 8px;
            background-color: #22d3ee;
            border-radius: 50%;
            box-shadow: 0 0 10px #22d3ee;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 211, 238, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 211, 238, 0); }
        }

        .hidden { display: none !important; }

        /* Ajustes Responsivos para celulares */
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
                border-radius: 24px;
            }
            .panel-left {
                border-right: none;
                border-bottom: 1px solid var(--glass-border);
                padding: 30px 20px;
            }
            .panel-right {
                padding: 30px 20px;
            }
            .code-orb {
                width: 180px;
                height: 180px;
            }
            .code-number { font-size: 2.8rem; }
        }
    </style>
</head>
<body>

    <h1 class="main-title">AstraDrop</h1>

    <div class="dashboard">
        
        <!-- PANEL IZQUIERDO: ESTADO / CÓDIGO LOCAL -->
        <div class="panel-left">
            <div class="section-title">
                <i data-lucide="radio"></i> Dispositivo Local
            </div>
            
            <div class="code-orb" id="orb-element">
                <span class="code-label">Tu Código</span>
                <div class="code-number" id="my-id">••••</div>
            </div>

            <div class="status-text" id="pulse-status">
                <span class="pulse-icon"></span>
                <span id="status-string">Generando par cifrado...</span>
            </div>
        </div>

        <!-- PANEL DERECHO: CONEXIÓN Y OPERACIONES -->
        <div class="panel-right">
            
            <!-- Modo Espera: Conectar dispositivo remoto -->
            <div id="setup-zone">
                <div class="section-title">
                    <i data-lucide="smartphone-converting"></i> Vincular Dispositivos
                </div>
                <div class="input-wrapper">
                    <input type="text" id="peer-id-input" placeholder="0000" maxlength="4" autocomplete="off">
                </div>
                <button id="connect-btn">
                    <i data-lucide="link"></i> Conectar e Intercambiar
                </button>
            </div>

            <!-- Modo Activo: Transferencia de Archivos -->
            <div id="transfer-zone" class="hidden">
                <div class="section-title" style="color: #4ade80;">
                    <i data-lucide="check-circle-2"></i> Canal Sincronizado
                </div>
                
                <div class="dropzone" onclick="document.getElementById('fileInput').click()">
                    <i data-lucide="image-plus" style="width: 36px; height: 36px; color: var(--text-cyan);"></i>
                    <p>Arrastra imágenes aquí o haz clic para buscar</p>
                    <input type="file" id="fileInput" accept="image/*">
                </div>

                <div id="preview-container" class="hidden">
                    <div class="preview-box" id="preview"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Inicializar iconos de Lucide
        lucide.createIcons();

        // Generar un código de enlace de 4 dígitos aleatorio
        const shortId = Math.floor(1000 + Math.random() * 9000).toString();
        
        const peer = new Peer(shortId, { debug: 1 });
        let conn = null;

        // Al abrir la conexión PeerJS
        peer.on('open', (id) => {
            document.getElementById('my-id').innerText = id;
            document.getElementById('status-string').innerText = "Esperando enlace entrante...";
        });

        // Escucha si otro dispositivo introduce nuestro código (Caso PC / Receptor)
        peer.on('connection', (connection) => {
            conn = connection;
            initTransferUI();
        });

        // Ejecutar conexión manual al hacer click (Caso Celular / Emisor)
        document.getElementById('connect-btn').addEventListener('click', () => {
            const remoteId = document.getElementById('peer-id-input').value.trim();
            if (remoteId) {
                conn = peer.connect(remoteId);
                initTransferUI();
            }
        });

        // Configuración de la UI compartida y handlers al conectar
        function initTransferUI() {
            // Animación y cambio visual del estado en el panel izquierdo
            document.getElementById('orb-element').style.boxShadow = "0 0 40px rgba(34, 211, 238, 0.4), inset 0 0 20px rgba(34, 211, 238, 0.2)";
            document.getElementById('pulse-status').style.color = "#4ade80";
            document.getElementById('pulse-status').querySelector('.pulse-icon').style.backgroundColor = "#4ade80";
            document.getElementById('pulse-status').querySelector('.pulse-icon').style.boxShadow = "0 0 10px #4ade80";
            document.getElementById('status-string').innerText = "Enlace Activo P2P";

            // Alternar paneles de la derecha
            document.getElementById('setup-zone').classList.add('hidden');
            document.getElementById('transfer-zone').classList.remove('hidden');

            conn.on('open', () => { console.log("Canal WebRTC Seguro abierto."); });

            // Recepción de archivos
            conn.on('data', (data) => {
                if (data.file && data.type.startsWith('image/')) {
                    const blob = new Blob([data.file], { type: data.type });
                    const blobUrl = URL.createObjectURL(blob);
                    
                    const previewZone = document.getElementById('preview');
                    document.getElementById('preview-container').classList.remove('hidden');
                    
                    previewZone.innerHTML = `
                        <img src="${blobUrl}" alt="Imagen recibida">
                        <div style="padding: 12px;">
                            <a href="${blobUrl}" download="astradrop_${Date.now()}.png" style="text-decoration: none;">
                                <button style="background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); box-shadow: 0 4px 15px rgba(34, 197, 94, 0.3);">
                                    <i data-lucide="download"></i> Guardar Imagen
                                </button>
                            </a>
                        </div>
                    `;
                    lucide.createIcons(); // Actualiza iconos inyectados dinámicamente
                }
            });

            conn.on('close', () => {
                alert("Conexión finalizada.");
                location.reload();
            });
        }

        // Evento de envío de archivos
        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const localUrl = URL.createObjectURL(file);
            const previewZone = document.getElementById('preview');
            document.getElementById('preview-container').classList.remove('hidden');
            
            previewZone.innerHTML = `
                <img src="${localUrl}" alt="Enviando..." style="opacity: 0.5;">
                <div style="padding: 12px; text-align: center; color: var(--text-cyan); font-weight: 600; display:flex; align-items:center; justify-content:center; gap:8px;">
                    <i data-lucide="loader-2" class="spin" style="animation: spin 1s linear infinite;"></i> Transmitiendo paquete...
                </div>
            `;
            lucide.createIcons();

            // Estilos CSS rápidos para la animación de carga del icono
            const style = document.createElement('style');
            style.innerHTML = '@keyframes spin { 100% { transform: rotate(360deg); } }';
            document.head.appendChild(style);

            const reader = new FileReader();
            reader.onload = function(event) {
                if (conn && conn.open) {
                    conn.send({
                        file: event.target.result,
                        filename: file.name,
                        type: file.type
                    });
                    
                    // Modificar estado al terminar
                    previewZone.querySelector('img').style.opacity = "1";
                    previewZone.querySelector('div').innerHTML = `<i data-lucide="check" style="color:#4ade80"></i> ¡Enviado con éxito!`;
                    lucide.createIcons();
                } else {
                    alert("Se perdió la conexión del canal.");
                }
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
